# The website of the project: the idea, the state, the guides. Built locally (`task docs:build`,
# `task docs:serve`), on Read the Docs (.readthedocs.yaml, lex-polonica.readthedocs.io) and by
# .github/workflows/pages.yml from master into the github-pages branch (Q6). Always built from
# the repository root: mkdocs build -f docs/mkdocs.yml
site_name: P_JOL_ROLL
site_description: Every act of the Polish journals of laws, gathered in the open
site_author: Sett Sarverott
site_url: !ENV [SITE_URL, READTHEDOCS_CANONICAL_URL, "http://127.0.0.1:8000/"]
repo_url: https://github.com/Sarverott/P-jol-roll
repo_name: Sarverott/P-jol-roll
edit_uri: edit/development/docs/
copyright: Copyright &copy; 2026 Sett Sarverott, AGPL-3.0-only. Not (formally) legal advices.

docs_dir: .
site_dir: ../site
exclude_docs: |
  .*
  !/.agents/
  /mkdocs.yml
  /pyproject.toml
  /uv.lock
  /Taskfile.yml
  /_mkdocs/
  /wiki/
  /devlog/
  /almanac/

theme:
  name: material
  language: en
  # the images of the project (scripts/devops/media/build.sh); the card of a link in overrides/
  custom_dir: _mkdocs/overrides
  favicon: assets/images/favicon.png
  logo: assets/images/logo.png
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: indigo
      toggle: { icon: material/weather-night, name: dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: indigo
      toggle: { icon: material/weather-sunny, name: light mode }

plugins:
  - search

hooks:
  - _mkdocs/project.py   # the state on the home page, from TODO.md and features.md; links out of docs/ → GitHub

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: README.md
  - Guides:
      - guides/features.md
      - guides/functions.md
      - guides/installation.md
      - guides/gathering.md
      - guides/processing.md
      - guides/sources.md
      - guides/checkup.md
      - guides/second-machine.md
      - guides/huggingface.md
      - guides/data.md
      - guides/development.md
      - guides/translations.md
      - guides/mastermind.md
      - guides/analysis.md
  - Glossary: glossary/README.md
  # the devlog and the almanac live in the wiki of GitHub, copied there by task docs:wiki (phase 28)
  - Devlog (wiki): https://github.com/Sarverott/P-jol-roll/wiki/Devlog
  - Almanac (wiki): https://github.com/Sarverott/P-jol-roll/wiki/Almanac
  - Changelog:
      - changelog/phase-0.md
      - changelog/phase-1.md
      - changelog/phase-3.md
      - changelog/phase-4.md
      - changelog/phase-5.md
      - changelog/phase-6.md
      - changelog/phase-8.md
      - changelog/phase-9.md
      - changelog/phase-10.md
      - changelog/phase-12.md
      - changelog/phase-18.md
      - changelog/phase-19.md
      - changelog/phase-20.md
      - changelog/phase-21.md
      - changelog/phase-22.md
      - changelog/phase-28.md
      - changelog/phase-29.md
      - changelog/phase-30.md
      - changelog/phase-31.md
      - changelog/phase-32.md
      - changelog/phase-33.md
      - changelog/phase-23.md
      - changelog/phase-24.md
      - changelog/phase-25.md
      - changelog/phase-26.md
      - changelog/phase-27.md
  - For agents:
      - .agents/NOTES.md
      - .agents/jarvis.md
      - .agents/things-to-check.md
      - .agents/ideas.md
      - .agents/point-of-view.md
