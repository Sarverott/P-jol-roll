# https://taskfile.dev

version: '3'

# directories dataset, space and bucket are local sides of huggingface repositories
# listed in .map.json - compared file by file, only what differs is moved (src/hub.ts)
tasks:
  plan:
    desc: Show what differs between local directory and huggingface, name after "--" (e.g. task resources:plan -- dataset).
    cmds:
      - npm run --silent hub -- plan {{.CLI_ARGS}}

  pull:
    desc: Take files that are on huggingface and not here, name after "--".
    cmds:
      - npm run --silent hub -- pull {{.CLI_ARGS}}

  push:
    desc: Send files that are new or changed here, name after "--", needs HF_TOKEN.
    prompt: This writes to huggingface. Send?
    cmds:
      - npm run --silent hub -- push {{.CLI_ARGS}}
