# The official journals of the sixteen voivodeships (phase 43, Q23): every act of local and
# regional law - resolutions of communes, districts and regions, orders of the voivodes - as
# listed on dziennikiurzedowe.gov.pl (dzienniki-wojewodztw.html) on 2026-11-24. Most run one
# platform whose API answers as the ELI API of the Sejm does: /api/eli/acts/<code>/<year>.
#   host   where the journal is
#   code   its publisher's code in that API, filled in by `task regional` when the journal answers
journals:
  - {voivodeship: dolnośląskie, host: edzienniki.duw.pl, code: POL_WOJ_DS}
