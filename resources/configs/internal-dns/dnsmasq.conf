# internal-dns: dnsmasq answering every name under p-jol-roll.internal with this machine, where
# routing-proxy listens. Ask it on 127.0.0.1:15353 (DNS_PORT), e.g.
#   dig @127.0.0.1 -p 15353 webapp.p-jol-roll.internal
# or let the resolver of the system send that one domain to it (systemd-resolved: DNS=127.0.0.1:15353
# and Domains=~p-jol-roll.internal in a resolved.conf.d file).
no-resolv
no-hosts
log-queries
address=/p-jol-roll.internal/127.0.0.1
