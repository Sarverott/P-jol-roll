# log-collector: rsyslog taking the logs of every service over syslog (udp and tcp 514)
# and writing them into resources/.containerdatavol/log-collector/, a file per program.
module(load="imudp")
input(type="imudp" port="514")
module(load="imtcp")
input(type="imtcp" port="514")

global(workDirectory="/var/lib/rsyslog")

# docker sends the tag set in the service (p-jol-roll/<service>); "/" is not wanted in a file name
template(name="PerProgram" type="string" string="/logs/%programname:R,ERE,0,DFLT:[A-Za-z0-9_.-]+--end%.log")
template(name="Line" type="string" string="%timegenerated:::date-rfc3339% %hostname% %syslogtag%%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%\n")

*.* action(type="omfile" dynaFile="PerProgram" template="Line")
