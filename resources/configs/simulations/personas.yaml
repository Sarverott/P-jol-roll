# The people of the simulation bubble (phase 36, stacks/python/src/pjolroll/simulation.py): each a
# model of the host's Ollama speaking as one of them about a change of law, round after round.
# Different lives on purpose - age, work, place, what they care about - so an act is seen from
# where it lands. Invented people: no one real. More can be added; --personas N takes the first N.
