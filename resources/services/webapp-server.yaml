# webapp-server: the http api with the website, over gathered resources mounted read-only.
# Its image (resources/configs/webapp-server/Dockerfile, no browser) is published by every
# release as ghcr.io/sarverott/p-jol-roll-webapp-server - the demo space runs the same one.
# Included by compose.yaml at the root, with the root as its project directory, so the
# paths below are relative to the root of the repository.
services:
  webapp-server:
    build:
      context: .
      dockerfile: resources/configs/webapp-server/Dockerfile
    image: p-jol-roll-webapp-server
    environment:
      LOG_DIR: /tmp/logs
    ports:
      - "8080:8080"
    volumes:
      - ./resources:/data/resources:ro
    restart: unless-stopped
    # its logs to log-collector (udp: the service starts even when the collector does not run;
    # `docker compose logs` still shows them)
    logging:
      driver: syslog
      options:
        syslog-address: udp://127.0.0.1:5514
        tag: p-jol-roll-webapp-server
