[project]
name = "pjolroll-scripts-and-tools"
version = "0.1.0"
description = "P-JOL-ROL :: scripts and tools for installations, dev work and else non-typical cases"
readme = "README.md"
authors = [
    { name = "Sett Sarverott", email = "sett@sarverott.com" }
]
requires-python = ">=3.12"
dependencies = [
    "appimage-builder>=1.1.0",
    "commitizen>=4.19.2",
    "marimo>=0.25.1",
    "notebook>=7.6.3",
    "paramiko>=5.0.0",
    "pure-python-adb>=0.3.0.dev0",
    "pydrive>=1.3.1",
]

[project.scripts]
scripts = "scripts:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
