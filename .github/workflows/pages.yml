# The website of the project on GitHub Pages (Q6 of the devlog), as Amoorion keeps its page:
# built from master with the locked tools of docs/ (task docs:build, strict), then committed
# whole by the bot and force-pushed to the github-pages branch, which Pages serves.
# Pages has to be set once to serve that branch (repository settings, the owner's move).
name: pages

on:
  push:
    branches: [master]
    paths: ["docs/**", "README.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://sarverott.github.io/P-jol-roll/
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6

      - uses: go-task/setup-task@v2

      - name: Build the website into site/
        run: task docs:build

      - name: Keep it in the github-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Served as it is, not through Jekyll.
          touch site/.nojekyll
          git checkout --orphan github-pages
          git --work-tree site add --all
          git --work-tree site commit -q -m "website of ${GITHUB_SHA::7}, UNIXUSAT=$(date +%s%3N)"
          git push origin HEAD:github-pages --force
