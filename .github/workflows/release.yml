# Every push to master releases (phase 8 of the devlog) - a merged pull request
# development → master, a person's merge. In order, as Sett asked: the release first, then
# the documentation, then the website:
#   1. checks (checks.yml)
#   2. a version reaching master released already gets the patch (a hotfix); then the tag
#      v<version> and the GitHub release, skipped when that tag exists
#   3. Read the Docs activates and builds the tag (only with READTHEDOCS_API_TOKEN); beside
#      it the image of webapp-server goes to ghcr.io, and the demo space is set to it and
#      built again (only with HF_TOKEN)
#   4. the website built (the React introduction of webpage/ at the root, the MkDocs
#      documentation under docs/) and pushed to the github-pages branch
#   5. master merged back into development
# Every step is a script of scripts/devops/, runnable by hand.
name: "release › master: tag, docs, website, back into development"

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.hotfix.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: master, fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      - name: Hotfix bump (a released version reaching master)
        id: hotfix
        run: scripts/devops/release/hotfix.sh
      - name: Tag and GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/devops/release/release.sh

  container:
    # the image of webapp-server on ghcr.io, tagged X.Y.Z, X.Y and latest - the demo space builds
    # from the one its variable P_JOL_ROLL_VERSION names (the job "space" below)
    needs: release
    if: needs.release.outputs.tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ needs.release.outputs.tag }}" }
      - name: Build and push to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/devops/release/container.sh "${{ needs.release.outputs.tag }}"

  space:
    # the demo space set to this release and built again (resources/configs/space): its files
    # from git when they differ, its variable, a fresh build, then waited for until it serves
    # this release. The token is the space's trusted publisher (OIDC, phase 27), else the secret
    # HF_TOKEN; with neither it says so and keeps the release it has
    needs: [release, container]
    if: needs.release.outputs.tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub's token, exchanged on Hugging Face for one of the space
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ needs.release.outputs.tag }}" }
      - run: P_JOL_ROLL_VERSION="${{ needs.release.outputs.tag }}" scripts/devops/release/space.sh refresh

  readthedocs:
    needs: release
    if: needs.release.outputs.tag
    runs-on: ubuntu-latest
    env:
      READTHEDOCS_API_TOKEN: ${{ secrets.READTHEDOCS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: scripts/devops/docs/readthedocs.sh "${{ needs.release.outputs.tag }}"

  pages:
    # after the release and the documentation; the website of what master holds now
    needs: [release, readthedocs]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SITE_URL: https://sarverott.github.io/P-jol-roll/
    steps:
      - uses: actions/checkout@v7
        with: { ref: master }
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      - run: scripts/devops/pages/build.sh
      - run: scripts/devops/pages/publish.sh "${{ needs.release.outputs.tag || needs.release.outputs.version }}"

  back:
    needs: [release, container, space, readthedocs, pages]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      - name: master back into development
        run: scripts/devops/flow/merge-into.sh origin/master development
