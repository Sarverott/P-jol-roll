# The same checks as `task verify` and the hooks: Biome, TypeScript, the website build, tests,
# and the build of the durable runs. On every push to development and a contributor's
# dev/** branch, and on pull requests into the stations of the loop.
name: "checks › verify"

on:
  push:
    branches: [development, "dev/**"]
  pull_request:
    branches: [master, development, revision]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: go-task/setup-task@v2
      # scripts off: no browser download (checkup is not run here), no git hooks;
      # the task binary comes from setup-task
      - run: npm ci --ignore-scripts
      - run: task verify
      - name: Build of the durable runs (Nitro)
        working-directory: src/workflows
        run: npx nitro build
