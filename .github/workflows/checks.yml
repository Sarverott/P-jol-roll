# The same checks as `task check` and the hooks: Biome, TypeScript, the website build, tests,
# the build of the durable runs, and shellcheck of scripts/devops/. On every push to
# development and a contributor's dev/** branch, on pull requests into development and
# master, and called by the release (release.yml). A pull request from dev/<name> into
# development is merged once these pass (scripts/devops/flow/automerge.sh).
name: "checks › verify"

on:
  push:
    branches: [development, "dev/**"]
  pull_request:
    branches: [master, development]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: go-task/setup-task@v2
      # scripts off: no browser download (checkup is not run here), no git hooks;
      # the task binary comes from setup-task
      - run: npm ci --ignore-scripts
      - run: task check
      - name: Build of the durable runs (Nitro)
        working-directory: src/workflows
        run: npx nitro build
      - name: Scripts of the workflows
        run: scripts/devops/checks/shellcheck.sh
      - name: The introduction page (webpage/)
        run: npm ci --prefix webpage --no-audit --no-fund && npm run --prefix webpage build

  automerge:
    needs: verify
    if: >-
      github.event_name == 'pull_request'
      && github.base_ref == 'development'
      && startsWith(github.head_ref, 'dev/')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Merge dev/<name> into development
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/devops/flow/automerge.sh "${{ github.event.pull_request.number }}"
