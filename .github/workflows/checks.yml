# The same checks as `task check` and the pre-push hook: Biome, TypeScript, the website build,
# tests, the build of the durable runs, and shellcheck of scripts/devops/. Not on every push
# any more (phase 26): called by the gate of a pull request into master (gate.yml), by the
# release (release.yml) and by automerge.yml for pull requests into development, and
# dispatched on the branch of a bot (dev/dependabot, dev/Jarvis) by bots.yml - the merges
# nobody checked on a machine. It always
# checks the commit of its own event - never a ref given from outside, so no code of a pull
# request runs where a privileged workflow could share its cache (CodeQL
# actions/cache-poisoning). It asks only to read.
name: "checks › verify"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # the language packs: a submodule, their gist (phase 28)
      - run: git submodule update --init --depth 1 resources/locales
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: go-task/setup-task@v2
      # scripts off: no browser download (checkup is not run here), no git hooks;
      # the task binary comes from setup-task
      - run: npm ci --ignore-scripts
      # pdftotext for the texts of PDFs (tests/pdf.test.ts)
      - run: command -v pdftotext || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - run: task check
      - name: Build of the durable runs (Nitro)
        working-directory: src/workflows
        run: npx nitro build
      - name: Scripts of the workflows
        run: scripts/devops/checks/shellcheck.sh
      # the Python stack of the models and simulations (phase 34): ruff and pytest, its tests
      # starting the MCP server of src/mcp over stdio
      - uses: astral-sh/setup-uv@v7
      - name: The Python stack (stacks/python/)
        run: task python:check
      - name: The introduction page (webpage/)
        run: npm ci --prefix webpage --no-audit --no-fund && npm run --prefix webpage build

