# The same checks as `task check` and the hooks: Biome, TypeScript, the website build, tests,
# the build of the durable runs, and shellcheck of scripts/devops/. On every push to
# development and a contributor's dev/** branch, on pull requests into master, and called
# by the release (release.yml) and by automerge.yml for pull requests into development. It
# asks only to read: a called workflow cannot have more than its caller gives.
name: "checks › verify"

on:
  push:
    # dev/dependabot is checked once, when dependabot.yml lands it in development
    branches: [development, "dev/**", "!dev/dependabot"]
  pull_request:
    branches: [master]
  workflow_call:
    inputs:
      ref:
        description: what to check out (empty - the commit of the event)
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      # no cache when called with a ref: a cache written from code that ref names could be
      # read later by the default branch (CodeQL actions/cache-poisoning)
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: ${{ inputs.ref == '' && 'npm' || '' }}
      - uses: go-task/setup-task@v2
      # scripts off: no browser download (checkup is not run here), no git hooks;
      # the task binary comes from setup-task
      - run: npm ci --ignore-scripts
      # pdftotext for the texts of PDFs (tests/pdf.test.ts)
      - run: command -v pdftotext || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - run: task check
      - name: Build of the durable runs (Nitro)
        working-directory: src/workflows
        run: npx nitro build
      - name: Scripts of the workflows
        run: scripts/devops/checks/shellcheck.sh
      - name: The introduction page (webpage/)
        run: npm ci --prefix webpage --no-audit --no-fund && npm run --prefix webpage build

