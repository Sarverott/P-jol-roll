# Dependabot's pull requests (into dev/dependabot, .github/dependabot.yml), as the owner asked
# on 2026-11-22:
#   1. each one merges into dev/dependabot at once, with no checks of its own
#   2. dev/dependabot is checked (checks.yml) - one run at a time, a newer one cancels an older,
#      so a pile of pull requests is checked once
#   3. green: dev/dependabot lands in development (a merge commit) and is brought up to it
# pull_request_target gives the write token that a pull_request from Dependabot does not get;
# nothing of the pull request runs with it - the merge is one gh command, and the checks run
# with read rights only.
name: "flow › Dependabot: merge into dev/dependabot, check once, land in development"

on:
  pull_request_target:
    branches: [dev/dependabot]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merge:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with: { ref: dev/dependabot }
      - name: Merge into dev/dependabot
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/devops/flow/dependabot-merge.sh "${{ github.event.pull_request.number }}"

  checks:
    needs: merge
    if: ${{ !cancelled() && needs.merge.result != 'failure' }}
    concurrency:
      group: dependabot-checks
      cancel-in-progress: true
    uses: ./.github/workflows/checks.yml
    with:
      ref: dev/dependabot

  land:
    needs: checks
    runs-on: ubuntu-latest
    concurrency:
      group: dependabot-land
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      - name: dev/dependabot into development, then brought up to it
        run: scripts/devops/flow/dependabot-land.sh
