# Updates arrive on Dependabot's own contributor branch, dev/dependabot: its pull requests merge
# there without checks, and workflows/bots.yml checks the branch once and lands it in development
# (the owner, 2026-11-22).
# Routine updates come grouped, one pull request per ecosystem and week; a major version comes
# alone, because it is a migration. Dependabot reads this file from the default branch (master),
# so it is active only after it reaches master. Security updates ignore target-branch and open
# against master; the workflow bots.yml turns them to dev/dependabot.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev/dependabot
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # camoufox-js 0.13 wants playwright-core below 1.63 (its peer dependency); lift this
    # when a camoufox-js release allows a newer one
    ignore:
      - dependency-name: playwright
        versions: [">=1.63.0"]
    groups:
      npm-routine:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /webpage
    target-branch: dev/dependabot
    schedule:
      interval: weekly
    groups:
      webpage-routine:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev/dependabot
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    target-branch: dev/dependabot
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    target-branch: dev/dependabot
    schedule:
      interval: weekly
  # the Python tools: the push to Hugging Face (scripts/) and the website (docs/)
  - package-ecosystem: uv
    directories: [/scripts, /docs]
    target-branch: dev/dependabot
    schedule:
      interval: weekly
    groups:
      python-routine:
        update-types: [minor, patch]
