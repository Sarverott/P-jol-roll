# Examples of using P_JOL_ROLL from Python: Jupyter notebooks in notebooks/, turned into marimo
# notebooks in marimo/ and exported as static pages with the website (task examples:build).
[project]
name = "p-jol-roll-examples"
version = "0.21.1"
description = "Examples of P_JOL_ROLL from Python: the dataset, the bucket and the api"
authors = [
    { name = "Sett Sarverott", email = "sett@sarverott.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=0.30",
    "matplotlib>=3.9",
    "marimo>=0.13",
    "pandas>=2.2",
    "requests>=2.32",
]

[tool.uv]
package = false
