# https://taskfile.dev

version: '3'

# The Go stack of the decentralisation circuits (phase 37): stacks/go, a module of its own -
# README.md there. pjolseed makes the torrents of the dataset and the bucket and their IPFS
# directory, offline.
tasks:
  check:
    desc: 'The Go stack checked: gofmt, go vet, go test (the CIDs against what kubo gives)'
    dir: '{{.ROOT_DIR}}/stacks/go'
    cmds:
      - 'test -z "$(gofmt -l .)" || (gofmt -l . && echo "not formatted by gofmt, the files above" && exit 1)'
      - go vet ./...
      - go test ./...
      # the chain of the law, a module of its own (phase 39)
      - cd lawchain && go vet ./... && go test ./...

  mesh:
    desc: 'pjolmesh, the mirrors of the law (phase 38) - task go:mesh -- list / keys <mirror> / mirror <mirror>'
    dir: '{{.ROOT_DIR}}/stacks/go'
    cmds:
      - go run ./cmd/pjolmesh {{.CLI_ARGS}}

  chain:build:
    desc: 'lawchaind, the chain of the law (phase 39), built and installed into $GOPATH/bin'
    dir: '{{.ROOT_DIR}}/stacks/go/lawchain'
    cmds:
      - go install ./cmd/lawchaind

  roots:
    desc: 'The roots of the years sealed here (task seal), as the chain of the law takes them - task go:roots -- -journal DU'
    dir: '{{.ROOT_DIR}}/stacks/go'
    cmds:
      - go run ./cmd/pjolchain roots {{.CLI_ARGS}}

  torrents:
    desc: 'The dataset and the bucket as torrents with web seeds on Hugging Face, and their IPFS directory (CIDs, torrents.car), into resources/torrents/ - task go:torrents -- -only dataset / -dry / -limit 5; offline, nothing published'
    dir: '{{.ROOT_DIR}}/stacks/go'
    cmds:
      - go run ./cmd/pjolseed torrents -resources {{.ROOT_DIR}}/resources {{.CLI_ARGS}}
