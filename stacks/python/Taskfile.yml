# https://taskfile.dev

version: '3'

# The Python stack of the models and simulations (phase 34): stacks/python, a uv project of its
# own reading the law through the project's MCP tools - README.md there.
tasks:
  sync:
    desc: The Python stack's environment (uv sync in stacks/python).
    dir: '{{.ROOT_DIR}}/stacks/python'
    cmds:
      - uv sync

  check:
    desc: 'The Python stack checked: ruff, then pytest (its tests start the MCP server of this repository over stdio, on a dataset of their own)'
    dir: '{{.ROOT_DIR}}/stacks/python'
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .
      - uv run pytest -q

  simulate:
    desc: 'The simulation bubble (phase 36) - people of resources/configs/simulations/personas.yaml talk about an act in rounds, each a model of the host''s Ollama (SIMULATION_MODEL, ministral-3:8b): task python:simulate -- DU/1997/939 --rounds 3 --personas 6; kept in resources/simulations/'
    dir: '{{.ROOT_DIR}}/stacks/python'
    cmds:
      - uv run pjolroll simulate {{.CLI_ARGS}}

  propose:
    desc: 'Improvements proposed (phase 36) - a model (PROPOSE_MODEL, qwen3:8b) reads an act, its findings (task analyse), debates and simulations through MCP and writes proposals: task python:propose -- DU/1997/939; kept in resources/proposals/. Not legal advice'
    dir: '{{.ROOT_DIR}}/stacks/python'
    cmds:
      - uv run pjolroll propose {{.CLI_ARGS}}

  offices:
    desc: 'The declaration of transparency (phase 44): the public offices'' official contacts from dane.gov.pl (resources/configs/transparency/sources.yaml) into dataset/transparency/offices.jsonl'
    dir: '{{.ROOT_DIR}}/stacks/python'
    cmds:
      - uv run pjolroll offices

  geocode:
    desc: 'Offices with no coordinates placed by OpenStreetMap''s Nominatim, one request a second, cached - task python:geocode -- --limit 3000 (about an hour)'
    dir: '{{.ROOT_DIR}}/stacks/python'
    cmds:
      - uv run pjolroll geocode {{.CLI_ARGS}}

  networks:
    desc: 'The address space of the state: networks and autonomous systems registered in RIPE to Polish public institutions, into dataset/transparency/networks.jsonl'
    dir: '{{.ROOT_DIR}}/stacks/python'
    cmds:
      - uv run pjolroll networks

  law:
    desc: 'The law from the Python stack - task python:law -- tools / act DU/1918/2 / text DU/1918/2 / nearest "..." / ask "..." [--escalate|--hard] (API_URL)'
    dir: '{{.ROOT_DIR}}/stacks/python'
    cmds:
      - uv run pjolroll {{.CLI_ARGS}}
