# The services of P_JOL_ROLL, one file each in resources/services/ (phase 6 of the devlog).
#   docker compose up -d   ->   webapp-server :8080, log-collector :5514, docs-server :8000
#   --profile demo         ->   hf-demo-space :7860, the space of Hugging Face run here
#   --profile gathering    ->   gatherer-daemon, parser-daemon - started by a person, with `run`
#   --profile local-network ->  routing-proxy (names like webapp.p-jol-roll.localhost), internal-dns
#   --profile llms         ->   llms-ollama and llms-api-host (LiteLLM) :4000 - run task init first
#   --profile mastermind   ->   llms-ollama with its models (llms-models) and mastermind :8081, the api
#                               answering /api/ask (phase 30); -f resources/services/gpu.yaml for the GPU
#   --profile agentic      ->   agentic-shell, a shell for agents: no port, `task shell` (Q13)
#   --profile ipfs         ->   ipfs (kubo): the torrents put on IPFS by the owner (phase 37), task torrents:publish
# Each file is included with the root as its project directory: paths in it start here.
include:
  - path: resources/services/webapp-server.yaml
    project_directory: .
  - path: resources/services/typesense.yaml
    project_directory: .
  - path: resources/services/log-collector.yaml
    project_directory: .
  - path: resources/services/docs-server.yaml
    project_directory: .
  - path: resources/services/hf-demo-space.yaml
    project_directory: .
  - path: resources/services/gatherer-daemon.yaml
    project_directory: .
  - path: resources/services/parser-daemon.yaml
    project_directory: .
  - path: resources/services/routing-proxy.yaml
    project_directory: .
  - path: resources/services/internal-dns.yaml
    project_directory: .
  - path: resources/services/llms-api-host.yaml
    project_directory: .
  - path: resources/services/mastermind.yaml
    project_directory: .
  - path: resources/services/agentic-shell.yaml
    project_directory: .
  - path: resources/services/ipfs.yaml
    project_directory: .
