# The services of P_JOL_ROLL, one file each in resources/services/ (phase 6 of the devlog).
#   docker compose up -d   ->   http://localhost:8080 (webapp-server)
# Each file is included with the root as its project directory: paths in it start here.
include:
  - path: resources/services/webapp-server.yaml
    project_directory: .
  - path: resources/services/log-collector.yaml
    project_directory: .
