# https://taskfile.dev

version: '3'

includes:
  husky: ./.husky/Taskfile.yml
  github: ./.github/Taskfile.yml
  resources: ./resources/Taskfile.yml

tasks:

  resume:gather:
    desc: continues with all gathered until now with no clearing cache storage
    env:
      CRAWLEE_PURGE_ON_START: 0
    cmds:
      - task: gather 

  resume:gather:everything:
    desc: same as "task resume:gather" works for "task gather" but it is for "task gather:everything"
    env:
      CRAWLEE_PURGE_ON_START: 0
    cmds:
      - task: gather:everything 

  default:
    cmds:
      - task --list
    silent: true

  gather:
    desc: Gather from ELI API of Sejm, arguments after "--" (e.g. task gather -- 2026 --acts --limit 5), usage in src/main.ts.
    cmds:
      - npm run gather -- {{.CLI_ARGS}}

  gather:everything:
    desc: Every journal, every year, 4 files of every act - about 600 thousand requests, days of work, can be stopped and repeated.
    prompt: This asks API of Sejm for everything it has. Start?
    cmds:
      - npm run gather -- --all --acts --limit 0 {{.CLI_ARGS}}

  checkup:
    desc: Browser visits websites that show gathered acts, arguments after "--" (e.g. task checkup -- 2026 --limit 6).
    cmds:
      - npm run checkup -- {{.CLI_ARGS}}

  build:
    desc: Compile typescript into dist.
    cmds:
      - npm run build

  test:
    desc: Run tests once.
    cmds:
      - npx vitest run

  check:
    desc: Lint and check formatting with biome, nothing gets changed.
    cmds:
      - npx biome check

  format:
    desc: Apply safe biome fixes and formatting.
    cmds:
      - npx biome check --write

  verify:
    desc: Everything that has to pass before push - biome check, build, tests.
    cmds:
      - task: check
      - task: build
      - task: test
