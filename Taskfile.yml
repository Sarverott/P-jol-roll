# https://taskfile.dev

version: '3'

includes:
  husky: ./.husky/Taskfile.yml
  github: ./.github/Taskfile.yml
  resources: ./resources/Taskfile.yml

tasks:

  default:
    cmds:
      - task --list
    silent: true

  gather:
    desc: Gather from ELI API of Sejm, arguments after "--" (e.g. task gather -- 2026 --acts --limit 5), usage in src/main.ts.
    cmds:
      - npm run gather -- {{.CLI_ARGS}}

  gather:everything:
    desc: Every journal, every year, every file of every act - hundreds of thousands of requests, days of work, can be stopped and started again.
    prompt: This asks API of Sejm for everything it has. Start?
    cmds:
      - npm run gather -- --all --acts --limit 0 {{.CLI_ARGS}}

  gather:changes:
    desc: Acts changed since the previous such run (or a day - task gather:changes -- 2026-10-01), their listings, details and references again.
    cmds:
      - npm run gather -- --since {{.CLI_ARGS | default "last"}}

  seal:
    desc: Write checksums of gathered files that have no record yet; "task seal -- --check" reads every file again and names these that differ.
    cmds:
      - npm run --silent seal -- {{.CLI_ARGS}}

  compile:
    desc: Tables of dataset from raw files of bucket - details and references of acts, a year in a file.
    cmds:
      - npm run --silent compile

  text:
    desc: Markdown from gathered html texts, with checksums of both and address of source.
    cmds:
      - npm run --silent text

  sejm:
    desc: Work of Sejm - processes and prints of a term, arguments after "--" (e.g. task sejm -- 10 --files --limit 50).
    cmds:
      - npm run sejm -- {{.CLI_ARGS}}

  saos:
    desc: Court judgments from SAOS by months of years, arguments after "--" (e.g. task saos -- 2025 --limit 3).
    cmds:
      - npm run saos -- {{.CLI_ARGS}}

  checkup:
    desc: Browser visits websites that show gathered acts, arguments after "--" (e.g. task checkup -- 2026 --limit 6).
    cmds:
      - npm run checkup -- {{.CLI_ARGS}}

  build:
    desc: Compile typescript into dist.
    cmds:
      - npm run build

  test:
    desc: Run tests once.
    cmds:
      - npx vitest run

  check:
    desc: Lint and check formatting with biome, nothing gets changed.
    cmds:
      - npx biome check

  format:
    desc: Apply safe biome fixes and formatting.
    cmds:
      - npx biome check --write

  verify:
    desc: Everything that has to pass before push - biome check, build, tests.
    cmds:
      - task: check
      - task: build
      - task: test
