# https://taskfile.dev

version: '3'

# settings of this machine (RESOURCES_DIR, HF_TOKEN, ELI_API...) for every task; the shell wins over .env
dotenv: ['.env']

env:
  ELECTRON_DISABLE_SANDBOX: 1 

includes:
  husky: ./.husky/Taskfile.yml
  github: ./.github/Taskfile.yml
  resources: ./resources/Taskfile.yml
  unittesting: ./tests/unittesting/Taskfile.yml
  flow: ./scripts/devops/Taskfile.yml
  docs: ./docs/Taskfile.yml
  examples: ./examples/Taskfile.yml
  devlog:
    taskfile: ./docs/devlog/Taskfile.yml
    dir: ./docs/devlog
  src:
    taskfile: ./src/Taskfile.yml
    dir: .
    flatten: true

tasks:

  default:
    # NOTE: we want to make easy project lounching for newcommers, so cui louncher should be runned when we call "task" and current listing of commands will be "task help"
    # ANSWER: done - bare "task" opens the launcher of src/tui/launcher/ (a menu of every Taskfile, and a REPL); "task help" lists
    desc: The launcher - a menu of every Taskfile and its tasks, and a REPL where tasks are commands (without a terminal, the list).
    interactive: true
    cmds:
      - node_modules/.bin/tsx src/tui/launcher/main.ts
    silent: true

  shell:
    desc: The agentic-shell container (Q13) started, and bash in it - the repository at /workspace
    interactive: true
    cmds:
      - mkdir -p resources/.containerdatavol/agentic-shell
      - docker compose --profile agentic up -d --build agentic-shell
      - docker compose exec agentic-shell bash

  help:
    desc: Every task with one line each.
    cmds:
      - task --list
    silent: true

  init:
    desc: First launch on this machine - checks what is installed, makes .env from .env.example, generates secrets; once (task init -f again).
    cmds:
      - node src/devtools/init.ts
    status:
      - test -f resources/.containerdatavol/init/done

  gather:
    desc: Gather from ELI API of Sejm, arguments after "--" (e.g. task gather -- 2026 --acts --limit 5), usage in src/core/main.ts.
    cmds:
      - npm run gather -- {{.CLI_ARGS}}

  gather:everything:
    desc: Every journal, every year, every file of every act - hundreds of thousands of requests, days of work, can be stopped and started again.
    prompt: This asks API of Sejm for everything it has. Start?
    cmds:
      - npm run gather -- --all --acts --limit 0 {{.CLI_ARGS}}

  gather:changes:
    desc: Acts changed since the previous such run (or a day - task gather:changes -- 2026-10-01), their listings, details and references again.
    cmds:
      - npm run gather -- --since {{.CLI_ARGS | default "last"}}

  seal:
    desc: Write checksums of gathered files that have no record yet; "task seal -- --check" reads every file again and names these that differ.
    cmds:
      - npm run --silent seal -- {{.CLI_ARGS}}

  compile:
    desc: Tables of dataset from raw files of bucket - details and references of acts, a year in a file.
    cmds:
      - npm run --silent compile

  map:
    desc: The map of the whole law - acts of each preset placed by ForceAtlas2 into dataset/map/ (task map -- statutes-in-force for one).
    cmds:
      - npm run --silent map -- {{.CLI_ARGS}}

  text:
    desc: Markdown from gathered html texts, with checksums of both and address of source; "task text -- --pdf" also from PDFs of acts without html (poppler).
    cmds:
      - npm run --silent text -- {{.CLI_ARGS}}

  sejm:
    desc: Work of Sejm - processes and prints of a term, arguments after "--" (e.g. task sejm -- 10 --files --limit 50).
    cmds:
      - npm run sejm -- {{.CLI_ARGS}}

  saos:
    desc: Court judgments from SAOS by months of years, arguments after "--" (e.g. task saos -- 2025 --limit 3).
    cmds:
      - npm run saos -- {{.CLI_ARGS}}

  checkup:
    desc: Browser visits websites that show gathered acts, arguments after "--" (e.g. task checkup -- 2026 --limit 6).
    cmds:
      - npm run checkup -- {{.CLI_ARGS}}

  build:
    desc: Compile typescript into dist.
    cmds:
      - npm run build

  test:
    desc: Run tests once.
    cmds:
      - npx vitest run

  version:sync:
    desc: Every version field (lock, api, MCP, extension, Python projects) written from the version of package.json.
    cmds:
      - node src/devtools/version.ts sync

  lint:
    desc: Lint and check formatting with biome, nothing gets changed.
    cmds:
      - npx biome check

  format:
    desc: Apply safe biome fixes and formatting.
    cmds:
      - npx biome check --write

  check:
    desc: Every check, as in every BOS project - biome, build (typescript and website), tests; the same in CI.
    cmds:
      - task: lint
      - task: build
      - task: test

  verify:
    desc: The same as check - the older name, kept.
    cmds:
      - task: check
