# https://taskfile.dev
# ways into gathered data: api, MCP, website, desktop window, android app, browser extension

version: '3'

tasks:

  serve:
    desc: 'Http api with live notices (socket.io) and the built website, on http://127.0.0.1:8080 - PORT and HOST in environment change it; task serve -- --allow-writing: the viewer starts the writing functions too, each after a yes (this machine only, Q19)'
    cmds:
      - npm run serve -- {{.CLI_ARGS}}

  mcp:
    desc: MCP server over stdio for AI agents, read-only (e.g. claude mcp add p-jol-roll -- npx tsx src/mcp/main.ts); over http it is /mcp of task serve and of the space.
    cmds:
      - npm run --silent mcp

  mcp:ask:
    desc: Ask the MCP server what an agent would - its tools, or one with arguments (task mcp:ask -- act eli=DU/2026/1); MCP_URL=http://.../mcp asks a running api instead of stdio.
    cmds:
      - npx tsx src/mcp/client.ts {{.CLI_ARGS}}

  mastermind:ask:
    desc: 'A question to the law mastermind (phase 30): a model reads the acts through the MCP tools and cites them by ELI (task mastermind:ask -- "..."; -- --json all of it). The host''s Ollama and deepseek-r1:8b unless MASTERMIND_URL / MASTERMIND_MODEL; MCP_URL asks a running api''s tools'
    cmds:
      - npx tsx src/mastermind/main.ts {{.CLI_ARGS}}

  agent:
    desc: 'The executive agent (phase 33): a small qwen in opencode does what you give it, reading the law through the MCP tools, writing only into resources/agent/ - task agent -- "what to do"; the host''s Ollama (AGENT_MODEL, AGENT_OLLAMA_URL); every run kept in resources/conversations/'
    cmds:
      - npx tsx src/mastermind/agent.ts {{.CLI_ARGS}}

  agent:container:
    desc: 'The executive agent in the agents'' shell (compose profiles agentic and llms: its own Ollama with the model pulled) - task agent:container -- "what to do"'
    dir: '{{.ROOT_DIR}}'
    cmds:
      - docker compose --profile agentic --profile llms up -d --build agentic-shell llms-ollama llms-models
      - docker compose exec agentic-shell npx tsx src/mastermind/agent.ts {{.CLI_ARGS}}

  mastermind:compare:
    desc: 'Every team of resources/configs/mastermind/families.yaml asked the questions of questions.yaml (-- gemma bielik: only those); each conversation kept in resources/conversations/, a line per answer here (phase 31)'
    cmds:
      - npx tsx src/mastermind/compare.ts {{.CLI_ARGS}}

  mastermind:up:
    desc: 'The mastermind as containers (compose profile mastermind): Ollama with its models pulled, the api answering /api/ask on 127.0.0.1:8081; the GPU taken when nvidia-smi answers - for a machine without the host''s Ollama'
    dir: '{{.ROOT_DIR}}'
    cmds:
      - |
        files="-f compose.yaml"
        if command -v nvidia-smi > /dev/null && nvidia-smi > /dev/null 2>&1; then files="$files -f resources/services/gpu.yaml"; echo "the GPU given to Ollama"; fi
        docker compose $files --profile mastermind up -d --build
        echo "models are pulled once (docker compose logs -f llms-models); then: curl -G http://127.0.0.1:${MASTERMIND_PORT:-8081}/api/ask --data-urlencode 'question=...'"

  mastermind:down:
    desc: 'The containers of the mastermind stopped (the models stay in resources/.containerdatavol/ollama)'
    dir: '{{.ROOT_DIR}}'
    cmds:
      - docker compose --profile mastermind down

  web:build:
    desc: Website of src/web with the viewer of src/gui, into dist/web.
    cmds:
      - npx astro build

  web:dev:
    desc: Website with reload on change; the api has to run beside it (PUBLIC_API=http://127.0.0.1:8080 task web:dev).
    cmds:
      - npm run web:dev

  desktop:
    desc: Electron window around the viewer - builds the website, starts the api for itself; p-jol-roll://act/DU/2026/1 after "--" opens an act.
    cmds:
      - task: web:build
      - npm run desktop -- {{.CLI_ARGS}}

  desktop:check:
    desc: The desktop app started with every window hidden - it prints what the viewer shows and quits (no screen needed; the website built first).
    env:
      DESKTOP_CHECK: "1"
    cmds:
      - npm run desktop -- {{.CLI_ARGS}}

  app:sync:
    desc: Android app by Capacitor in src/app - first time "task app:sync -- add android", then plain; needs Android SDK. PUBLIC_API has to name a reachable host.
    dir: src/app
    cmds:
      - npx astro build --root ../..
      - npx --yes @capacitor/cli {{.CLI_ARGS | default "sync android"}}

  extension:
    desc: Where the browser extension is and how to load it.
    cmds:
      - echo "Firefox - about:debugging, This Firefox, Load Temporary Add-on, src/firefox-ext/manifest.json"
      - echo "Chrome - chrome://extensions, developer mode, Load unpacked, src/firefox-ext"
    silent: true

  workflows:build:
    desc: Durable runs (Workflow SDK on Nitro) of src/workflows, into src/workflows/.output - built from inside that directory, so names of workflows match.
    dir: src/workflows
    cmds:
      - npx nitro build

  workflows:serve:
    desc: Server of durable runs on http://127.0.0.1:8090, this machine only; runs are kept in .workflow-data. Starts nothing by itself.
    env:
      HOST: 127.0.0.1
      PORT: "8090"
      # the same place workflows:web reads, wherever the task is started from
      WORKFLOW_LOCAL_DATA_DIR: "{{.ROOT_DIR}}/.workflow-data"
    cmds:
      - node src/workflows/.output/server/index.mjs

  workflows:daily:
    desc: Start one daily run - changes, seal, compile, text, plans of dataset and bucket, then it waits up to 3 days for your answer before any push. JSON after "--" changes it.
    cmds:
      - 'curl -s -X POST -H "content-type: application/json" -d ''{{.CLI_ARGS | default "{}"}}'' http://127.0.0.1:8090/api/daily'
      - echo

  workflows:approve:
    desc: Answer a waiting run - "task workflows:approve -- push:2026-...Z" pushes, add "no" after the token to end it without pushing.
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        if [ "${2:-yes}" = "no" ]; then push=false; else push=true; fi
        curl -s -X POST -H "content-type: application/json" -d "{\"token\": \"$1\", \"push\": $push, \"by\": \"$USER\"}" http://127.0.0.1:8090/api/daily/approve
        echo

  workflows:web:
    desc: Web interface of the Workflow SDK - the workflows built (workflows:build first), and the runs of workflows:serve with their steps, outputs, what waits.
    env:
      # NOTE (src/workflows/nitro.config.ts): i tested it once but nothing was there. interface looks like workflows are missing
      # ANSWER: it looks for the manifest of the workflows in .well-known/ of the folder it starts in;
      # Nitro writes it into its build folder, so it is named here - and the runs, as the server keeps them
      WORKFLOW_MANIFEST_PATH: "{{.ROOT_DIR}}/src/workflows/node_modules/.nitro/workflow/manifest.json"
      WORKFLOW_LOCAL_DATA_DIR: "{{.ROOT_DIR}}/.workflow-data"
      WORKFLOW_LOCAL_BASE_URL: http://127.0.0.1:8090
    cmds:
      - npx workflow web {{.CLI_ARGS}}
